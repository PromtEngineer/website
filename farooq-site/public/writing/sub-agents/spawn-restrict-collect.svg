<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect width="1200" height="700" fill="#FAF9F5"/>

  <defs>
    <marker id="as" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6E675E"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1D9E75"/></marker>
  </defs>

  <!-- header -->
  <text x="600" y="40" font-size="20" fill="#6E675E" text-anchor="middle">spawn &#8594; restrict &#8594; collect</text>
  <text x="600" y="66" font-size="16" fill="#6E675E" text-anchor="middle">one parent window stays clean; children absorb the heavy work</text>

  <!-- parent agent (orchestrator) -->
  <rect x="56" y="250" width="340" height="200" rx="12" fill="#161614"/>
  <text x="226" y="298" font-size="23" fill="#F2EFE9" text-anchor="middle">parent agent</text>
  <text x="226" y="326" font-size="15" fill="#A8A39A" text-anchor="middle">decompose, delegate, verify</text>
  <text x="86" y="366" font-size="13" fill="#A8A39A">context</text>
  <rect x="86" y="374" width="280" height="14" fill="none" stroke="#A8A39A" stroke-width="1"/>
  <rect x="86" y="374" width="64" height="14" fill="#1D9E75"/>
  <text x="86" y="414" font-size="13" fill="#A8A39A">stays small: plan + summaries</text>

  <!-- spawn arrows (parent to children) -->
  <line x1="396" y1="275" x2="754" y2="160" stroke="#6E675E" stroke-width="1.5" marker-end="url(#as)"/>
  <line x1="396" y1="330" x2="754" y2="355" stroke="#6E675E" stroke-width="1.5" marker-end="url(#as)"/>
  <line x1="396" y1="385" x2="754" y2="550" stroke="#6E675E" stroke-width="1.5" marker-end="url(#as)"/>

  <!-- return arrows (children to parent) -->
  <line x1="754" y1="195" x2="396" y2="305" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="754" y1="390" x2="396" y2="362" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="754" y1="585" x2="396" y2="418" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- child 1: explore -->
  <rect x="760" y="100" width="384" height="170" rx="10" fill="#F1EFE7" stroke="#6E675E" stroke-width="1"/>
  <text x="784" y="138" font-size="19" fill="#1C1A17">sub-agent: explore</text>
  <text x="784" y="162" font-size="13" fill="#6E675E">fresh session, no parent history</text>
  <text x="784" y="190" font-size="15" fill="#1C1A17">tools: read, grep, glob</text>
  <text x="784" y="216" font-size="12" fill="#6E675E">context</text>
  <rect x="784" y="224" width="200" height="12" fill="none" stroke="#6E675E" stroke-width="1"/>
  <rect x="784" y="224" width="168" height="12" fill="#161614"/>
  <text x="996" y="234" font-size="12" fill="#6E675E">fills up</text>
  <text x="784" y="258" font-size="13" fill="#0F6E56">returns: map of relevant files</text>

  <!-- child 2: general -->
  <rect x="760" y="290" width="384" height="170" rx="10" fill="#F1EFE7" stroke="#6E675E" stroke-width="1"/>
  <text x="784" y="328" font-size="19" fill="#1C1A17">sub-agent: general</text>
  <text x="784" y="352" font-size="13" fill="#6E675E">fresh session, no parent history</text>
  <text x="784" y="380" font-size="15" fill="#1C1A17">tools: read, edit, bash</text>
  <text x="784" y="406" font-size="12" fill="#6E675E">context</text>
  <rect x="784" y="414" width="200" height="12" fill="none" stroke="#6E675E" stroke-width="1"/>
  <rect x="784" y="414" width="168" height="12" fill="#161614"/>
  <text x="996" y="424" font-size="12" fill="#6E675E">fills up</text>
  <text x="784" y="448" font-size="13" fill="#0F6E56">returns: what changed and why</text>

  <!-- child 3: verify -->
  <rect x="760" y="480" width="384" height="170" rx="10" fill="#F1EFE7" stroke="#6E675E" stroke-width="1"/>
  <text x="784" y="518" font-size="19" fill="#1C1A17">sub-agent: verify</text>
  <text x="784" y="542" font-size="13" fill="#6E675E">fresh session, no parent history</text>
  <text x="784" y="570" font-size="15" fill="#1C1A17">tools: read, bash (run tests)</text>
  <text x="784" y="596" font-size="12" fill="#6E675E">context</text>
  <rect x="784" y="604" width="200" height="12" fill="none" stroke="#6E675E" stroke-width="1"/>
  <rect x="784" y="604" width="168" height="12" fill="#161614"/>
  <text x="996" y="614" font-size="12" fill="#6E675E">fills up</text>
  <text x="784" y="638" font-size="13" fill="#0F6E56">returns: pass / fail + failures</text>

  <!-- legend -->
  <line x1="56" y1="680" x2="96" y2="680" stroke="#6E675E" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="108" y="685" font-size="14" fill="#6E675E">spawn: scoped prompt + restricted tools</text>
  <line x1="560" y1="680" x2="600" y2="680" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="612" y="685" font-size="14" fill="#0F6E56">collect: summary or artifact, not the transcript</text>
</svg>
