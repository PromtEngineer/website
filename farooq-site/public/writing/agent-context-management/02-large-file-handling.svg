<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1210" viewBox="0 0 2048 1210">
  <rect width="2048" height="1210" fill="#ffffff"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#363a42}.title{font-size:52px;font-weight:800}.h{font-size:38px;font-weight:800;fill:#3f9a45}.sub{font-size:23px;fill:#9aa0a6;font-weight:700}.item{font-size:26px;font-weight:700}.panel{fill:#fbfff2;stroke:#dfeedd;stroke-width:4}.red{fill:#fff0f0;stroke:#cf3d3d}.purple{fill:#f1e8ff;stroke:#84319a}.orange{fill:#fff7ec;stroke:#d76522}.blue{fill:#e8f4ff;stroke:#2c73b8}.green{fill:#f7ffe8;stroke:#68952a}.gray{fill:#f4f5f6;stroke:#9aa0a6;stroke-dasharray:6 9}</style>
  <text x="1024" y="75" text-anchor="middle" class="title">How Four Harnesses Handle Large Files</text>
  <g transform="translate(35,130)"><rect width="470" height="930" rx="45" class="panel"/><text x="235" y="55" text-anchor="middle" class="h">Pi</text><text x="235" y="90" text-anchor="middle" class="sub">Harness-first</text></g>
  <g transform="translate(540,130)"><rect width="470" height="930" rx="45" class="panel"/><text x="235" y="55" text-anchor="middle" class="h">OpenClaw</text><text x="235" y="90" text-anchor="middle" class="sub">Defense in depth</text></g>
  <g transform="translate(1045,130)"><rect width="470" height="930" rx="45" class="panel"/><text x="235" y="55" text-anchor="middle" class="h">Claude Code</text><text x="235" y="90" text-anchor="middle" class="sub">Harness-first + remote</text></g>
  <g transform="translate(1550,130)"><rect width="470" height="930" rx="45" class="panel"/><text x="235" y="55" text-anchor="middle" class="h">Letta</text><text x="235" y="90" text-anchor="middle" class="sub">Memory-first</text></g>
  <g transform="translate(70,260)"><rect width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="47" text-anchor="middle" class="item" fill="#cf3d3d">2K lines / 50KB cap</text><rect y="95" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="142" text-anchor="middle" class="item" fill="#84319a">Head truncation</text><rect y="190" width="400" height="72" rx="12" class="orange" stroke-width="4"/><text x="200" y="237" text-anchor="middle" class="item" fill="#d76522">Continuation nudge</text><rect y="285" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="332" text-anchor="middle" class="item" fill="#84319a">Offset / limit pagination</text><rect y="380" width="400" height="72" rx="12" class="gray" stroke-width="4"/><text x="200" y="427" text-anchor="middle" class="item" fill="#8a8f96">Bash fallback (sed)</text><text x="0" y="600" class="sub">On oversize error says:</text><rect y="630" width="400" height="72" rx="12" class="orange" stroke-width="4"/><text x="200" y="677" text-anchor="middle" class="item" fill="#d76522">"Use offset/limit"</text></g>
  <g transform="translate(575,260)"><rect width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="47" text-anchor="middle" class="item" fill="#cf3d3d">2K lines / 50KB cap</text><rect y="95" width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="142" text-anchor="middle" class="item" fill="#cf3d3d">Bootstrap file char caps</text><rect y="190" width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="237" text-anchor="middle" class="item" fill="#cf3d3d">Tool result budget</text><rect y="285" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="332" text-anchor="middle" class="item" fill="#84319a">Head+tail truncation</text><rect y="380" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="427" text-anchor="middle" class="item" fill="#84319a">75/25 head/tail split</text><rect y="475" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="522" text-anchor="middle" class="item" fill="#84319a">Offset / limit pagination</text><rect y="630" width="400" height="72" rx="12" class="orange" stroke-width="4"/><text x="200" y="677" text-anchor="middle" class="item" fill="#d76522">"Use offset=N to continue"</text></g>
  <g transform="translate(1080,260)"><rect width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="47" text-anchor="middle" class="item" fill="#cf3d3d">256KB byte gate</text><rect y="95" width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="142" text-anchor="middle" class="item" fill="#cf3d3d">25K token budget</text><rect y="190" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="237" text-anchor="middle" class="item" fill="#84319a">File dedup (mtime check)</text><rect y="285" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="332" text-anchor="middle" class="item" fill="#84319a">Offset / limit pagination</text><rect y="380" width="400" height="72" rx="12" class="green" stroke-width="4"/><text x="200" y="427" text-anchor="middle" class="item" fill="#68952a">Feature flags (remote)</text><rect y="475" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="522" text-anchor="middle" class="item" fill="#84319a">Persist oversize to disk</text><rect y="630" width="400" height="72" rx="12" class="red" stroke-width="4"/><text x="200" y="677" text-anchor="middle" class="item" fill="#cf3d3d">"Search instead of reading"</text></g>
  <g transform="translate(1585,260)"><rect width="400" height="72" rx="12" class="blue" stroke-width="4"/><text x="200" y="47" text-anchor="middle" class="item" fill="#2c73b8">Parse + chunk + embed</text><rect y="95" width="400" height="72" rx="12" class="blue" stroke-width="4"/><text x="200" y="142" text-anchor="middle" class="item" fill="#2c73b8">Vector store</text><rect y="190" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="237" text-anchor="middle" class="item" fill="#84319a">Semantic search</text><rect y="285" width="400" height="72" rx="12" class="orange" stroke-width="4"/><text x="200" y="332" text-anchor="middle" class="item" fill="#d76522">Context-scaled view</text><rect y="380" width="400" height="72" rx="12" class="gray" stroke-width="4"/><text x="200" y="427" text-anchor="middle" class="item" fill="#8a8f96">LRU eviction</text><rect y="475" width="400" height="72" rx="12" class="purple" stroke-width="4"/><text x="200" y="522" text-anchor="middle" class="item" fill="#84319a">Offset / limit pagination</text><rect y="630" width="400" height="72" rx="12" class="orange" stroke-width="4"/><text x="200" y="677" text-anchor="middle" class="item" fill="#d76522">"Use functions to view"</text></g>
  <text x="1024" y="1130" text-anchor="middle" class="sub">Legend: red = hard cap, purple = transform, blue = storage, orange = model hint, green = remote</text>
</svg>
