<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1440" viewBox="0 0 2048 1440">
  <rect width="2048" height="1440" fill="#ffffff"/>
  <style>
    text{font-family:Arial, Helvetica, sans-serif;fill:#343840}
    .title{font-size:54px;font-weight:800}
    .h{font-size:34px;font-weight:800}
    .s{font-size:26px;font-weight:600}
    .small{font-size:22px;fill:#9aa0a6;font-weight:600}
    .box{fill:#f8fafc;stroke:#3f444b;stroke-width:6}
    .red{fill:#fff0f0;stroke:#cf3d3d}.purple{fill:#f1e8ff;stroke:#84319a}.orange{fill:#fff7ec;stroke:#d76522}.blue{fill:#e8f4ff;stroke:#2c73b8}.green{fill:#fbfff2;stroke:#68952a}
  </style>
  <text x="1024" y="70" text-anchor="middle" class="title">What Fills the Context Window</text>
  <rect x="590" y="165" width="840" height="1040" rx="58" class="box"/>
  <text x="1010" y="225" text-anchor="middle" class="h">Context Window</text>
  <text x="1010" y="260" text-anchor="middle" class="small">128K - 200K tokens</text>
  <rect x="635" y="310" width="750" height="80" rx="14" fill="#eef0f3" stroke="#3f444b" stroke-width="2"/><text x="1010" y="360" text-anchor="middle" class="s">System prompt + tool definitions</text>
  <rect x="635" y="420" width="750" height="80" rx="14" fill="#dcefff" stroke="#2c73b8" stroke-width="2"/><text x="1010" y="470" text-anchor="middle" class="s" fill="#2c73b8">Conversation history</text>
  <rect x="635" y="530" width="750" height="130" rx="22" fill="#fff4f4" stroke="#cf3d3d" stroke-width="2"/><text x="1010" y="605" text-anchor="middle" class="s" fill="#cf3d3d">File contents (often the largest)</text>
  <rect x="635" y="685" width="750" height="110" rx="18" fill="#f1e8ff" stroke="#84319a" stroke-width="2"/><text x="1010" y="750" text-anchor="middle" class="s" fill="#84319a">tool results (accumulate fast)</text>
  <rect x="635" y="820" width="750" height="90" rx="16" fill="#fff7ec" stroke="#d76522" stroke-width="2"/><text x="1010" y="875" text-anchor="middle" class="s" fill="#d76522">sub-agent responses</text>
  <rect x="635" y="935" width="750" height="80" rx="14" fill="#e8f4ff" stroke="#2c73b8" stroke-width="2"/><text x="1010" y="985" text-anchor="middle" class="s" fill="#2c73b8">session memory / compaction summaries</text>
  <text x="1010" y="1075" text-anchor="middle" class="small">reserved for model output</text>
  <text x="1010" y="1165" text-anchor="middle" class="small">pressure builds from all sides</text>
  <rect x="745" y="1250" width="530" height="90" rx="18" fill="#eef0f3" stroke="#3f444b" stroke-width="4"/><text x="1010" y="1305" text-anchor="middle" class="s">LLM (reasoning engine)</text>
  <text x="1010" y="1385" text-anchor="middle" class="small">sees only what the harness lets through</text>
  <rect x="50" y="300" width="420" height="115" rx="22" class="red" stroke-width="4"/><text x="260" y="350" text-anchor="middle" class="s" fill="#cf3d3d">File reads</text><text x="260" y="385" text-anchor="middle" class="s" fill="#cf3d3d">10K-250K tokens each</text>
  <rect x="50" y="490" width="420" height="115" rx="22" class="purple" stroke-width="4"/><text x="260" y="540" text-anchor="middle" class="s" fill="#84319a">Tool call results</text><text x="260" y="575" text-anchor="middle" class="s" fill="#84319a">grep, bash, search</text>
  <rect x="50" y="680" width="420" height="115" rx="22" class="orange" stroke-width="4"/><text x="260" y="730" text-anchor="middle" class="s" fill="#d76522">Sub-agent results</text><text x="260" y="765" text-anchor="middle" class="s" fill="#d76522">forked task output</text>
  <rect x="50" y="870" width="420" height="115" rx="22" class="blue" stroke-width="4"/><text x="260" y="920" text-anchor="middle" class="s" fill="#2c73b8">Session state</text><text x="260" y="955" text-anchor="middle" class="s" fill="#2c73b8">memory, summaries</text>
  <rect x="1540" y="300" width="450" height="875" rx="58" class="green" stroke-width="4"/>
  <text x="1765" y="355" text-anchor="middle" class="h" fill="#68952a">Harness manages</text>
  <g class="green" stroke-width="3">
    <rect x="1575" y="410" width="380" height="80" rx="14"/><rect x="1575" y="520" width="380" height="80" rx="14"/><rect x="1575" y="630" width="380" height="80" rx="14"/><rect x="1575" y="740" width="380" height="80" rx="14"/><rect x="1575" y="850" width="380" height="80" rx="14"/><rect x="1575" y="960" width="380" height="80" rx="14"/>
  </g>
  <text x="1765" y="460" text-anchor="middle" class="s" fill="#68952a">Cap file reads</text><text x="1765" y="570" text-anchor="middle" class="s" fill="#68952a">Truncate tool results</text><text x="1765" y="680" text-anchor="middle" class="s" fill="#68952a">Compact history</text><text x="1765" y="790" text-anchor="middle" class="s" fill="#68952a">Evict stale data</text><text x="1765" y="900" text-anchor="middle" class="s" fill="#68952a">Nudge to search/grep</text><text x="1765" y="1010" text-anchor="middle" class="s" fill="#68952a">Restore after compact</text>
</svg>
